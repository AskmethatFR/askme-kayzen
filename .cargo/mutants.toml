# cargo-mutants configuration. Driven by scripts/mutation-gate.sh, which scopes
# the run to the current diff.

# The Dioxus entry point only launches the app; it holds no behavior and no test
# could kill a mutant there. Everything else in the app crate stays in — its
# views, its route parsing and its wiring services do carry tests.
exclude_globs = ["app/src/main.rs"]
