name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 40 || 20 }}
    # scripts/test-shell-units.sh refuses (exit 2) without a local NDK r25c
    # toolchain, so this job installs one below, same as android-aab.
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Relies on the repo being public: the unauthenticated `git fetch
          # origin` below needs no token. Going private breaks that fetch,
          # not this line -- re-add a token there, not here.
          persist-credentials: false

      - name: Refuse a PR not targeting main
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref != 'main'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          echo "refusing: this PR's base branch is '$BASE_REF', not main — no fallback base-ref" >&2
          exit 1

      # Pinned so a toolchain update is a reviewable diff, never a silent
      # drift between a developer's machine and the runner.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Runs unconditionally: scripts/check.sh's workflow-lint gate is part
      # of the no-work-class path too, so both "Gates (pull request)" and
      # "Gates (push to main)" below need it on PATH.
      #
      # @law: taiki-e/install-action does not support actionlint at any
      # version (absent from its own TOOLS.md), and its cargo-binstall
      # fallback can never work either -- actionlint is a Go binary, not a
      # crates.io crate. Installed straight from the pinned upstream
      # release instead, digest-verified against a value pinned in this
      # file, never against a checksums file fetched from the same place a
      # tampered binary would come from.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSLo "$asset" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${asset}"
          echo "${ACTIONLINT_SHA256}  ${asset}" | sha256sum -c -
          tar -xzf "$asset" actionlint
          install -m 0755 actionlint /usr/local/bin/actionlint
          installed="$(actionlint -version | head -1)"
          [ "$installed" = "$ACTIONLINT_VERSION" ] || {
            echo "installed actionlint reports version '$installed', expected '$ACTIONLINT_VERSION'" >&2
            exit 1
          }

      # r25c, same reason as android-aab's own "Install NDK r25c" step below.
      # @law: sdkmanager ships under $ANDROID_HOME/cmdline-tools/latest/bin/,
      # not on PATH, on this runner image.
      - name: Install NDK r25c
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || {
            echo "sdkmanager not found at $SDKMANAGER" >&2
            exit 1
          }
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "ndk;25.2.9519653"
          [ -d "$NDK_HOME" ] || {
            echo "NDK did not land at $NDK_HOME after sdkmanager install" >&2
            exit 1
          }

      # ref: alone does not guarantee origin/main exists locally, even at
      # fetch-depth: 0 — fetched explicitly so the merge-base below has
      # something to resolve against. No --depth here: git rejects
      # `--depth 0` (fatal since 2.32.0), and fetch-depth: 0 above already
      # de-shallowed the clone — this fetch only needs to materialise the
      # refs/remotes/origin/main ref itself.
      - name: Fetch main
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Resolve the mutation gate's base-ref
        if: github.event_name == 'pull_request'
        id: base_ref
        run: |
          BASE="$(git merge-base origin/main HEAD)"
          if [ -z "$BASE" ]; then
            echo "no defensible base-ref: this slice's branch does not descend from origin/main" >&2
            exit 1
          fi
          echo "base-ref: $BASE"
          git log --oneline -1 "$BASE"
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"

      # Pinned to the exact version ADR-0009's recorded blind spots
      # (L1-bis, L2, L4, L5, the `fn new` hard-skip) were measured against.
      - name: Install cargo-mutants
        if: github.event_name == 'pull_request'
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2.86.4
        with:
          tool: cargo-mutants@27.1.0

      - name: Gates (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ steps.base_ref.outputs.sha }}
        run: scripts/check.sh new-feature "$BASE_SHA"

      - name: Gates (push to main)
        if: github.event_name != 'pull_request'
        run: scripts/check.sh

  # Separate from `gates`: needs its own ANDROID_HOME/NDK_HOME wiring and a
  # pinned OS (ubuntu-24.04, not ubuntu-latest) because every fact this job
  # relies on -- which NDKs the runner preinstalls, where sdkmanager and the
  # SDK sit -- is 24.04-specific, and this repo's policy is that any such
  # drift is a reviewable diff, not a silent runner upgrade.
  #
  # Runs on push:main too, not just pull_request: the cache policy below is
  # save-if: main, so a PR-only job would restore-miss forever and pay the
  # full cold build cost (~22-32 min) on every run. The push:main run is
  # what actually populates the cache PRs then restore from.
  #
  # No keystore ever reaches this job or any PR: it proves an unsigned,
  # correctly-versioned, 16 KB-aligned AAB builds, nothing more.
  #
  # A fork PR still runs the build and its gates, but "Upload unsigned AAB"
  # below is skipped for one -- a fork author gets no compiled artifact
  # under this repo's own Actions namespace.
  android-aab:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.97.0"
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: android-aab
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dx
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2.86.4
        with:
          tool: dioxus-cli@0.7.9

      # NDK r25c, not the r27/r28/r29 this runner otherwise preinstalls:
      # r28+ aligns to 16 KB by default, so on those the gate would pass
      # whether or not --rustc-args carried the alignment flags, while the
      # developer's own r25c machine still ships 4 KB -- the gate would
      # stop discriminating exactly the regression it exists to catch.
      # Licences are already accepted on the preinstalled SDK.
      #
      # @law: this runner preinstalls the Android command-line tools but
      # does not put sdkmanager on PATH -- it ships under
      # $ANDROID_HOME/cmdline-tools/latest/bin/, invoked by full path here.
      - name: Install NDK r25c
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || {
            echo "sdkmanager not found at $SDKMANAGER" >&2
            exit 1
          }
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "ndk;25.2.9519653"
          [ -d "$NDK_HOME" ] || {
            echo "NDK did not land at $NDK_HOME after sdkmanager install" >&2
            exit 1
          }

      # @law: the `env` context is not available in `jobs.<job_id>.env` --
      # only a step's `run:` shell sees a runner-inherited variable like
      # JAVA_HOME_17_X64 directly, so this is the only place it is visible.
      - name: Resolve JDK 17
        run: |
          [ -n "${JAVA_HOME_17_X64:-}" ] || {
            echo "JAVA_HOME_17_X64 is unset on this runner image" >&2
            exit 1
          }
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: Build unsigned release AAB
        id: bundle
        run: |
          aab_path="$(scripts/android-bundle.sh)"
          echo "aab_path=$aab_path" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned AAB
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kayzen-unsigned-aab-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ steps.bundle.outputs.aab_path }}
          retention-days: 7
          if-no-files-found: error
